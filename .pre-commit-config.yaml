repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: pytest-backend
        name: Run backend tests
        entry: bash -c 'PYTHONPATH=backend pytest -q backend/tests/'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-build
        name: Build frontend
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
